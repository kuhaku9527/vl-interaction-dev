[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joyvl-asr-adapter"
version = "0.1.0"
description = "连接 JoyVL ASR 与本地语音模型的 FastAPI WebSocket 适配服务"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "sherpa-onnx>=1.10.30",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
joyvl-asr-adapter = "asr_adapter:main"

[tool.setuptools]
py-modules = ["asr_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `jarvis` added 2026-09-21 (#151): the two provider suites live beside the code
# they test (services/asr/jarvis/) rather than under tests/, so they were NEVER
# collected -- 46 tests declared, 2 collected. That is how a stale assertion
# (test_factory_invalid_raises) stayed red-and-unseen after a refactor changed
# the production error message. Do not "tidy" these files back under tests/
# without re-deriving their `parents[...]` depth: they use parents[3] = repo
# root, which is correct only at this nesting.
testpaths = ["tests", "jarvis"]
