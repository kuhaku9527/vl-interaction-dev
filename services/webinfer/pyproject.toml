[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joyvl-webinfer-adapter"
version = "0.1.0"
description = "StreamingHarness live OpenAI-compatible adapter (webinfer service)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joy Future Academy"},
]
keywords = [
    "vlm",
    "vision-language-model",
    "openai-compatible",
    "streaming",
    "llama-server",
    "vllm",
    "character-prompt",
    "persona",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# No new dependencies are required for the character-prompt work;
# everything in `system_prompts.py` uses the Python stdlib.  The
# runtime dependencies below mirror `install/pyproject.toml` so the
# service can be installed standalone in a fresh venv.
dependencies = [
    "aiohttp>=3.9.5",
    "aiohttp-cors>=0.7.0",
    "Pillow>=10.4.0",
    "openai>=1.54.3",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
joyvl-webinfer-adapter = "live_adapter:main"

[tool.setuptools]
# All 40 top-level modules shipped by this adapter package.
# Keep this list in sync with the *.py files at the package root
# (excluding the tests/ subpackage, which is not a top-level module).
# See the package-smoke CI job for a regression gate; that gate only
# catches modules imported eagerly, so this list is also asserted by
# tests/test_packaging_py_modules.py.
py-modules = [
    "adapter_core",
    "adapter_types",
    "app",
    "chat_payload",
    "config",
    "decision_eval_axis",
    "decision_eval_bounds",
    "decision_eval_card",
    "decision_eval_criteria",
    "decision_eval_report",
    "decision_eval_rounds",
    "decision_eval_score",
    "decision_eval_set",
    "decision_eval_sources",
    "decision_eval_synthetic",
    "decision_eval_timing",
    "decision_eval_timing_card",
    "decision_eval_timing_criteria",
    "decision_eval_timing_report",
    "decision_eval_timing_sources",
    "decision_eval_timing_synthetic",
    "decision_events",
    "frame_parsing",
    "infer_loop",
    "io_utils",
    "live_adapter",
    "memory_io",
    "memory_store_client",
    "memory_summarizer",
    "prompt_assembly",
    "prompt_building",
    "prompt_constants",
    "request_parsing",
    "response_format",
    "session",
    "silence_control",
    "stream_protocol",
    "summarizer_routing",
    "system_prompts",
    "time_ranges",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
