[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joy-interaction-webui"
version = "0.1.0"
description = "实时视觉语言模型交互 Web 界面"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joy Future Academy"}
]
keywords = [
    "vision",
    "ai",
    "vlm",
    "vision-language-model",
    "webui",
    "real-time",
    "webrtc",
    "webcam",
    "vllm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "aiohttp>=3.9.5",
    "aiohttp-cors>=0.7.0",
    "aiortc>=1.9.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.4",
    "Pillow>=10.4.0",
    "openai>=1.54.3",
    "httpx>=0.27.2",
    "av>=12.3.0",
    "psutil>=5.9.8",
    "onnxruntime>=1.16.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    # kws_param_sweep (services/scripts) transitively imports asr's kws.py,
    # which does a top-level `import sherpa_onnx`. The sweep regression test
    # needs the module importable to run, so pin it to match services/asr.
    "sherpa-onnx>=1.10.30",
]

[project.scripts]
joy-interaction-webui = "joy_interaction_webui.server:main"
joy-interaction-webui-stop = "joy_interaction_webui.server:stop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joy_interaction_webui = ["static/*", "static/**/*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 启用真 bug 规则（对齐根 select，但排除 D 文档债——webui 无 docstring 纪律，276 处噪声）
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "RUF",
          # ADR-0011 Batch 3: security/correctness signals
          "BLE001",  # blind except — catch specific exceptions
          "S101",    # assert — no assert for runtime validation in prod
          "S311",    # pseudo-random — use `secrets` for security-sensitive use
          # ADR-0011 Batch 2 gate: extend security surface (2026-07-24)
          "S104",    # bind to all interfaces — LAN dev servers use `# noqa: S104`
          "S108",    # insecure temp file/dir — intentional cache paths use `# noqa: S108`
          "S110",    # try/except/pass — intentional in tests
          "S112",    # try/except/continue
          "S310"]    # urllib URL open — trusted internal URLs use `# noqa: S310`
# 装饰性 / 非 bug 债务放 ignore，避免无意义 churn
ignore = [
    "E501",      # 行过长（100 处），black line-length=100 已控，不重复强制
    "B025",      # 重复 except（装饰性）
    "N802",      # 函数命名（改名将破坏调用方）
    "N805",      # 方法首参命名（装饰性）
    "N806",      # 函数内变量命名（装饰性）
    "N814",      # camelCase import as constant（装饰性）
    "RUF001",    # 模糊 unicode（中文注释/字符串误报）
    "SIM105",    # suppressible-exception（装饰性）
    "SIM108",    # if-else→三元（装饰性）
    "SIM114",    # 同体 if 合并（装饰性）
    "SIM103",    # needless-bool（装饰性）
    "UP031",     # printf % 格式化（风格偏好，非 bug）
    "D203",      # 与 D211 冲突，根已忽略
    "D213",      # 与 D212 冲突，根已忽略
]

# --- ADR-0011 Batch 3 manual baseline (ruff 0.15.22 has no --baseline) ---
# Paths are relative to THIS config file (services/webui). These are
# PRE-EXISTING production violations of BLE001/S101/S311, IGNORED (not fixed)
# so the gate flips to enforcing on day one. Burn down by removing a file's
# entry once its violation(s) are fixed (see reports/handoff-lint-gate-batch3-*.md).
[tool.ruff.lint.per-file-ignores]
"src/joy_interaction_webui/asr.py" = ["BLE001"]
"src/joy_interaction_webui/background_model.py" = ["BLE001"]
"src/joy_interaction_webui/jarvis_mode.py" = ["BLE001", "S101"]
"src/joy_interaction_webui/jarvis_routes.py" = ["BLE001"]
"src/joy_interaction_webui/jarvis_session.py" = ["BLE001"]
"src/joy_interaction_webui/live_enroll.py" = ["BLE001"]
"src/joy_interaction_webui/live_frames.py" = ["BLE001"]
"src/joy_interaction_webui/live_llm.py" = ["BLE001"]
"src/joy_interaction_webui/live_mode.py" = ["BLE001"]
"src/joy_interaction_webui/live_proactive.py" = ["BLE001"]
"src/joy_interaction_webui/live_routes.py" = ["BLE001"]
"src/joy_interaction_webui/rtsp_track.py" = ["BLE001"]
"src/joy_interaction_webui/server.py" = ["BLE001"]
"src/joy_interaction_webui/tts.py" = ["BLE001"]
"src/joy_interaction_webui/tts_turn_common.py" = ["BLE001"]
"src/joy_interaction_webui/turn_streaming.py" = ["BLE001"]
"src/joy_interaction_webui/video_processor.py" = ["BLE001"]
"src/joy_interaction_webui/vlm_service.py" = ["BLE001"]
# S101 (assert) / BLE001 (blind except) are benign in tests.
"**/tests/*" = ["S101", "BLE001"]
"**/test_*.py" = ["S101", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
