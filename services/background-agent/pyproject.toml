[project]
name = "streamingharness-background-agent-shim"
# Windows users: prefer `uv sync` over editable install so the hermes-api
# shim and the original codex-api shim share the same lockfile.
description = "StreamingHarness background-agent shim (defaults to hermes-agent gateway, keeps codex CLI as a fallback)"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.12.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
streamingharness-codex-api = "codex_api.main:main"
streamingharness-hermes-api = "hermes_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codex_api", "hermes_api"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
